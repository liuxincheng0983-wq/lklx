<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="utf-8">
<title>两颗心 · 实时定位</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFE9F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="两颗心">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="只属于你们两个人的实时定位地图">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=24">
</head>
<body>

<div id="app">

  <!-- ===== 地图层：从首页点「实时地图」进来 ===== -->
  <div id="maplayer">
  <div id="map"></div>
  <div id="veil"></div>

  <div class="topbar">
    <button class="backbtn" id="btnHome" aria-label="返回首页">‹</button>
    <div class="brand">
      <span id="logoSlot"></span>
      <span><b>两颗心</b><br><small>L I A N G &nbsp;K E &nbsp;X I N</small></span>
    </div>
    <div class="topright">
      <div class="conn"><i class="dot" id="dot"></i><span id="connText">未设置</span></div>
      <button class="mechip" id="btnMe" aria-label="我的">
        <span id="meAv"></span>
      </button>
    </div>
  </div>

  <div class="geobar" id="geoBar" hidden></div>

  <div class="fabs" id="fabs"></div>

  <div class="sheet" id="sheet">
    <div class="dragzone" id="dragzone">
      <div class="handle"></div>
      <div class="peek">
        <div class="pav" id="peerAv"></div>
        <div class="peek-info">
          <div class="nm" id="peerName">等待对方…</div>
          <div class="sb" id="peerSub">把暗号发给女朋友就能看到了</div>
        </div>
        <div class="distbox">
          <div class="d" id="peerDist">--</div>
          <div class="l" id="peerDistLbl">距离你</div>
        </div>
      </div>
      <div class="seg" id="seg"></div>
    </div>
    <div class="panels" id="panels">
      <div class="panel on" id="panelPeer"></div>
      <div class="panel" id="panelTrail"></div>
      <div class="panel" id="panelChat"></div>
    </div>
  </div>

  </div><!-- /maplayer -->

  <!-- ===== 首页：一打开就是恋爱天数 + 功能宫格 ===== -->
  <div id="home">
    <div class="htop">
      <button class="mechip" id="meChip2" aria-label="我的"><span id="meAv2"></span></button>
      <div class="hbrand">
        <b id="hBrand">两颗心</b>
        <small><i class="dot" id="dot2"></i><span id="connText2">未设置</span></small>
      </div>
      <button class="mechip" id="btnSet" aria-label="设置">⚙️</button>
    </div>
    <div class="hscroll" id="hscroll">
      <div id="homeStatus"></div>
      <div id="homeHero"></div>
      <div id="homeToday"></div>
      <div class="hsection"><span>我们的小日子</span></div>
      <div class="hgrid" id="homeGrid"></div>
      <div class="hfoot">数据只在你们两台手机之间加密传输 · 没有会员也没有广告</div>
    </div>
  </div>

  <!-- ===== 时光：今天几点到几点在哪里 ===== -->
  <div id="timeline" hidden>
    <div class="htop">
      <div class="hbrand left">
        <b>时光</b>
        <small id="tlDate">今天</small>
      </div>
      <button class="mechip" id="tlAdd" aria-label="添加记录">＋</button>
    </div>
    <div class="daystrip" id="dayStrip"></div>
    <div class="hscroll" id="timelineBody"></div>
  </div>

  <!-- ===== 底部导航 ===== -->
  <nav class="tabbar" id="tabbar"></nav>

  <div class="drawer" id="meDrawer" hidden>
    <div class="dhead">
      <div class="dt">我的</div>
      <button class="dclose" id="meClose" aria-label="关闭">✕</button>
    </div>
    <div class="dbody" id="panelMe"></div>
  </div>

  <div class="drawer" id="daily" hidden>
    <div class="dhead2">
      <button class="backbtn2" id="dailyBack">‹</button>
      <div class="dt2" id="dailyTitle">心动日常</div>
    </div>
    <div class="dbody" id="dailyBody"></div>
  </div>

  <div class="overlay" id="welcome"></div>
  <div class="toast" id="toast"></div>

  <div class="notecard" id="noteCard" hidden></div>
</div>

<script src="kitty.js?v=24"></script>
  <script src="qr.js?v=24"></script>
  <script>window._AMapSecurityConfig={securityJsCode:"e9ef6cc0e412e66ee6656e585c10f7ff"};</script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=7b0d626725d843182c34d1023a114d95"></script>

<script src="daily.js?v=24"></script>
<script src="app.js?v=24"></script>
<script>
  document.getElementById('logoSlot').innerHTML = Kitty.logo(30);
  // 网页端：首次成功打开后应用外壳常驻本机，即便网站被墙也能启动。
  // 安卓壳里跳过 —— 页面本来就来自本地 assets，离线缓存只会让它卡在旧版本。
  if ('serviceWorker' in navigator) {
    if (typeof LKLX !== 'undefined') {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    } else {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  }
</script>
</body>
</html>
