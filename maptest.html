<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高德 JS API 测试</title>
<style>
  html,body{margin:0;height:100%;font:14px/1.6 -apple-system,"PingFang SC",sans-serif}
  #map{width:100%;height:60vh;background:#eee}
  #log{padding:12px;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .ok{color:#0a0}.bad{color:#c00}
</style>
</head>
<body>
<div id="map"></div>
<div id="log">初始化中…</div>

<script>
  window._AMapSecurityConfig = { securityJsCode: 'e9ef6cc0e412e66ee6656e585c10f7ff' };
  window.__result = { steps: [] };
  function log(s, cls) {
    window.__result.steps.push(s);
    var l = document.getElementById('log');
    l.innerHTML += '\n<span class="' + (cls || '') + '">' + s + '</span>';
  }
</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=7b0d626725d843182c34d1023a114d95&plugin=AMap.Scale"></script>
<script>
(function () {
  if (typeof AMap === 'undefined') {
    window.__result.ok = false;
    window.__result.err = 'AMap 未加载 —— Key 可能无效或域名白名单不匹配';
    log('✗ AMap 未加载', 'bad');
    return;
  }
  log('✓ JS API 脚本加载成功', 'ok');
  try {
    var map = new AMap.Map('map', {
      zoom: 13, center: [113.2644, 23.1291], viewMode: '2D',
      mapStyle: 'amap://styles/normal', resizeEnable: true, zooms: [3, 19]
    });
    window.__result.ok = true;
    map.on('complete', function () {
      window.__result.complete = true;
      log('✓ 地图渲染完成（tilesLoaded）', 'ok');
    });

    // 测各种配色方案是否可用
    setTimeout(function () {
      var styles = ['normal','fresh','whitesmoke','light','dark','macaron','grey','blue','darkblue','wine','red','green','orange','graffiti'];
      var works = [];
      styles.forEach(function (s) {
        try { map.setMapStyle('amap://styles/' + s); works.push(s); }
        catch (e) { }
      });
      window.__result.styles = works;
      log('配色可用: ' + works.join(', '));
      map.setMapStyle('amap://styles/normal');

      // 测标记 + 折线 + 圆
      try {
        var mk = new AMap.Marker({
          position: [113.2644, 23.1291],
          content: '<div style="width:40px;height:40px;border-radius:50%;background:#FF6B9D;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>',
          offset: new AMap.Pixel(-20, -40), zIndex: 500
        });
        map.add(mk);
        var line = new AMap.Polyline({
          path: [[113.2644,23.1291],[113.2744,23.1341],[113.2844,23.1391]],
          strokeColor: '#FF6B9D', strokeWeight: 4, strokeOpacity: .75,
          strokeStyle: 'dashed', strokeDasharray: [1, 9], lineJoin: 'round', lineCap: 'round'
        });
        map.add(line);
        var cir = new AMap.Circle({
          center: [113.2644,23.1291], radius: 300,
          strokeColor: '#5FCBB2', strokeWeight: 1, strokeOpacity: .5,
          fillColor: '#5FCBB2', fillOpacity: .12
        });
        map.add(cir);
        window.__result.overlays = true;
        log('✓ 标记 / 折线 / 圆 创建成功', 'ok');
      } catch (e) {
        window.__result.overlays = false;
        log('✗ 图形创建失败: ' + e.message, 'bad');
      }

      // 测坐标逆序问题：AMap 是 [lng, lat]
      var c = map.getCenter();
      window.__result.center = [c.getLng(), c.getLat()];
      log('地图中心 [lng,lat] = [' + c.getLng().toFixed(4) + ', ' + c.getLat().toFixed(4) + ']');
      log('→ 应为纬度 23.13 / 经度 113.26，若是反的说明坐标顺序错了', c.getLat() > 20 && c.getLat() < 26 ? 'ok' : 'bad');

      window.__result.done = true;
      log('=== 全部完成 ===', 'ok');
    }, 1800);
  } catch (e) {
    window.__result.ok = false;
    window.__result.err = e.message;
    log('✗ 初始化失败: ' + e.message, 'bad');
  }
})();
</script>
</body>
</html>
