<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="utf-8">
<title>两颗心 · 实时定位</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFE9F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="两颗心">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="只属于你们两个人的实时定位地图">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>

<div id="app">
  <div id="map"></div>
  <div id="veil"></div>

  <div class="topbar">
    <div class="brand">
      <span id="logoSlot"></span>
      <span><b>两颗心</b><br><small>L I A N G &nbsp;K E &nbsp;X I N</small></span>
    </div>
    <div class="topright">
      <div class="conn"><i class="dot" id="dot"></i><span id="connText">未设置</span></div>
      <button class="mechip" id="btnDaily" aria-label="心动日常" style="font-size:20px">💕</button>
      <button class="mechip" id="btnMe" aria-label="我的">
        <span id="meAv"></span>
      </button>
    </div>
  </div>

  <div class="geobar" id="geoBar" hidden></div>

  <div class="fabs" id="fabs"></div>

  <div class="sheet" id="sheet">
    <div class="dragzone" id="dragzone">
      <div class="handle"></div>
      <div class="peek">
        <div class="pav" id="peerAv"></div>
        <div class="peek-info">
          <div class="nm" id="peerName">等待对方…</div>
          <div class="sb" id="peerSub">把暗号发给女朋友就能看到了</div>
        </div>
        <div class="distbox">
          <div class="d" id="peerDist">--</div>
          <div class="l" id="peerDistLbl">距离你</div>
        </div>
      </div>
      <div class="seg" id="seg"></div>
    </div>
    <div class="panels" id="panels">
      <div class="panel on" id="panelPeer"></div>
      <div class="panel" id="panelTrail"></div>
      <div class="panel" id="panelChat"></div>
    </div>
  </div>

  <div class="drawer" id="meDrawer" hidden>
    <div class="dhead">
      <div class="dt">我的</div>
      <button class="dclose" id="meClose" aria-label="关闭">✕</button>
    </div>
    <div class="dbody" id="panelMe"></div>
  </div>

  <div class="drawer" id="daily" hidden>
    <div class="dhead2">
      <div class="dt2" id="dailyTitle">心动日常</div>
      <button class="dclose" id="dailyBack">✕</button>
    </div>
    <div class="dbody" id="dailyBody"></div>
  </div>

  <div class="overlay" id="welcome"></div>
  <div class="toast" id="toast"></div>

  <div class="notecard" id="noteCard" hidden></div>
</div>

<script src="kitty.js?v=13"></script>
  <script>window._AMapSecurityConfig={securityJsCode:"e9ef6cc0e412e66ee6656e585c10f7ff"};</script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=7b0d626725d843182c34d1023a114d95"></script>

<script src="daily.js?v=13"></script>
<script>
/* 测试用：模拟安卓壳的原生桥，让网页以为自己跑在 App 里 */
window.LKLX = {
  ok: function(){return '1';},
  id: function(){return 'da47125bedb';},
  geo: function(){return JSON.stringify({ok:1,lat:23.1300,lon:113.2640,ac:10,sp:0,t:Date.now(),b:80,sse:1,q:230,err:''});},
  inbox: function(){return '[]';},
  peer: function(){return '';},
  sys: function(){return '{}';},
  battery: function(){return -1;},
  sharing: function(){return '1';},
  cfg: function(a){ if(a){ console.log('cfg write '+a); return 'ok'; } return JSON.stringify({room:'kitty-n6j928az',nm:'刘信成',av:'{\"t\":\"k\",\"c\":\"#FF6B9D\"}',intv:8,enc:true,bg:true,near:500}); },
  notify: function(t,b){ console.log('notify '+t+' '+b); },
  vibrate: function(){}, bars: function(){}, nav: function(){}, send: function(){},
  share: function(){}
};
</script>
<script src="app.js?v=13"></script>
<script>
  document.getElementById('logoSlot').innerHTML = Kitty.logo(30);
  // 网页端：首次成功打开后应用外壳常驻本机，即便网站被墙也能启动。
  // 安卓壳里跳过 —— 页面本来就来自本地 assets，离线缓存只会让它卡在旧版本。
  if ('serviceWorker' in navigator) {
    if (typeof LKLX !== 'undefined') {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    } else {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  }
</script>
</body>
</html>
